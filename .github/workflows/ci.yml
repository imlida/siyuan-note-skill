name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 构建与文档一致性校验（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 生成对照表与示例
        run: |
          npm run mapping
          npm run examples

      - name: 文档与实现一致性校验
        run: npm run check-docs

      - name: 确认工作区干净（生成物未漂移）
        run: git diff --exit-code -- docs
