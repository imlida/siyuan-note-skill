# 报告中的稳定用例 ID，与文件名保持一致。
id: av-set-cell-value-shape
# 这个用例验证什么。
title: av set-cell 的 value 按 keyType 包一层且定位参数齐全
# 背景（来自真实失败）：av set-cell 的 --value 是「部分Value 对象」，
# 文本字段必须是 {"text":{"content":"..."}} ——每个 keyType 都要包一层 content。
# 写成 {"text":"已归档"} 会漏掉内层对象。SKILL.md 早期只写 `--value '<JSON>'`，
# 没给出结构，Agent 因此稳定犯错（iteration-9 实测）。
# 定位参数 --av-id / --key-id / --item-id 同样容易漏。
description: |
  要求 Agent 用 --dry-run 构造请求体，再由脚本把其中的 --value 原样打给真实内核，
  用「内核停在哪一层报错」判定形态：停在 AVValue 反序列化 = 形态错；
  越过反序列化、报 key/item not found = 形态对。
  这样无需构造真实属性视图，也不会污染用户数据。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    思源笔记跑在 http://127.0.0.1:6806，siyuan 命令行工具已装好。

    我想改一个属性视图里某个单元格的文字值，把它改成「已归档」。
    假设 avID 是 20260101120000-avprobe，字段 ID 是 20260101120000-key0001，
    行的 itemID 是 20260101120000-item001。

    请先用 --dry-run 看看这条命令实际会发出什么请求体（不要真的写入），
    把 dry-run 打印的完整输出原样保存到当前目录 dry_run_output.txt，
    并在回答里说明 --value 到底该怎么传、为什么。

constraints:
  timeout_seconds: 240
  max_turns: 15

# 低成本前置门禁：dry-run 输出没落盘、或者压根没提到目标值，后面的内核校验都无从谈起。
expect:
  files_exist:
    - dry_run_output.txt
  file_contains:
    - path: dry_run_output.txt
      content: "已归档"

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: script
  # 脚本会用 Agent 给出的 --value 真打一次内核，按报错层级判定形态对错。
  # 不依赖真实属性视图，因此稳定且无副作用。
  script_path: evals/fixtures/scripts/verify_av_chain.py
  timeout_seconds: 90