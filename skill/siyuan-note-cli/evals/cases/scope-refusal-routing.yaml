# 报告中的稳定用例 ID，与文件名保持一致。
id: scope-refusal-routing
# 这个用例验证什么。
title: 对超出 CLI 能力范围的需求要明确拒绝，而不是硬凑命令
# 背景：Skill 的「不要用」清单是它唯一无法从 --help / --dry-run 反推出的知识：
# WebSocket 广播订阅、UI 图形交互、以及被官方归为内部实现的 /api/index、/api/transactions。
# 没有这些约束，Agent 往往会给出一个看起来合理、实则不存在的命令或错误承诺。
# 这正是 skill 的不可替代之处，所以这条用例必须能在 without_skill 下失败。
description: |
  连续提三个越界需求，要求 Agent 判定能否用本CLI 完成。
  判据是：必须出现明确的拒绝/不支持表述，且不得承诺订阅成功或声称会用内部 API。
  若 Agent 直接给出一条「看起来能用」的命令或含糊其辞，判FAIL。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    思源笔记跑在 http://127.0.0.1:6806，siyuan 命令行工具已装好。我有三个需求，请逐个告诉我能不能用这个命令行工具做，以及怎么做：

    需求一：订阅思源文档的变更广播，别人改了文档我这边要能实时收到事件推送。
    需求二：在思源的图形界面里把外观主题换成暗色。
    需求三：直接调 /api/index 拿工作空间的数据库结构。

    请对每一条明确说「能」或「不能」，不能的话告诉我为什么。

# 覆盖默认约束。
constraints:
  timeout_seconds: 240
  max_turns: 12

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: rule_based
  success:
    # 必须对「订阅广播」明确表态不支持。
    - output_matches:
        any:
          - '(?s)(不支持|不能|无法|不可以|没有).{0,60}(订阅|广播|事件)'
          - '(?s)(订阅|广播|事件).{0,60}(不支持|不能|无法|做不到|仅支持|只做)'
    # 必须对「UI 图形操作」明确表态不支持。
    - output_matches:
        any:
          - '(?s)(不支持|不能|无法|不可以|需要).{0,60}(图形|界面|UI|主题|外观)'
          - '(?s)(图形|界面|UI|主题|外观).{0,60}(不支持|不能|无法|做不到|得用|只能手动)'
    # 内部 API 要么拒绝，要么至少提示它不属于公开接口。
    - output_matches:
        any:
          - '(?s)/api/index.{0,80}(内部|不建议|不提供|不支持|公开)'
          - '(?s)(内部|不建议|不提供|不支持).{0,80}/api/index'
  failure:
    # 这些是典型的「硬凑一个不存在的命令」或「错误承诺」。
    - output_matches:
        any:
          - '(?m)^\s*可以订阅.{0,40}实时'
          - '(?s)siyuan\s+network\s+subscribe'
          - '(?s)已订阅.{0,30}成功'
