# 报告中的稳定用例 ID，与文件名保持一致。
id: doc-create-then-read-back
# 这个用例验证什么。
title: 新建文档后能定位到它并读回内容
# 背景：考察 Skill 是否讲清doc create 的 --raw 返回值（纯块 ID 而非 JSON 对象）、
#--path 对应人类可读路径、以及同一 path 重复创建不会覆盖而会产生新文档。
description: |
  在真实运行的思源实例上执行一次完整的「建文档 → 拿 ID → 回读定位」链路。
  判定不依赖自然语言描述，而是直接查思源 API，确认文档真的存在且正文包含指定标记。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    我本机的思源笔记跑在 http://127.0.0.1:6806，siyuan 命令行工具已经装好了。
    帮我在思源里建一篇新文档，人类可读路径是 /skillup-eval-doc-7Q2X，
    正文就一句话：季度复盘要点 7Q2X。

    建完之后告诉我它的块 ID，并且把这个 ID 原样写进当前目录的 created_doc_id.txt。
    最后再帮我查一下这篇文档在磁盘上的存储路径是什么。

    请真的执行命令，不要只给我命令清单。

# 覆盖默认约束。
constraints:
  timeout_seconds: 300
  max_turns: 20

# 低成本前置门禁：文件没产出就没必要再跑校验脚本。
expect:
  files_exist:
    - created_doc_id.txt

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: script
  # 脚本从用例工作区根目录运行，退出码 0 表示 PASS。
  # 它会用 created_doc_id.txt 里的 ID 反查思源，确认文档真实存在。
  script_path: evals/fixtures/scripts/verify_doc_created.py
  timeout_seconds: 60
