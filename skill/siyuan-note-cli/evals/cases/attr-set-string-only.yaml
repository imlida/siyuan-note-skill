# 报告中的稳定用例 ID，与文件名保持一致。
id: attr-set-string-only
# 这个用例验证什么。
title: 块属性值必须传字符串
# 背景：思源的自定义属性值类型是 string，传数字会得到
# code=-1 "cannot unmarshal number into Go value of type string"，CLI 退出码 4。
# Skill 的错误排查表里明确记了这条，考察 Agent 是否能自己踩坑后自我修正。
description: |
  给出一个必然踩坑的属性写入任务（把数字写进属性），脚本直接查思源确认最终落库的是字符串形态。
  这个用例刻意不预设 Agent 会一次写对，允许它先错后改——真正考察的是最终状态是否正确。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    思源笔记跑在 http://127.0.0.1:6806，siyuan 命令行工具已装好。

    请做这几步：
    1. 新建一篇文档，人类可读路径 /skillup-eval-attr-7Q2X。
    2. 给这篇文档的块设置一个自定义属性，名字叫 custom-reviewer，值填「小林」。
    3. 再设置一个属性 custom-score，值填 3。
    4. 把这个块的属性全部读出来，写进当前目录 attrs_result.json，
       并且在终端回答我：custom-score 这个属性最终存进去的值是什么类型。

    请真的执行命令。

# 覆盖默认约束。
constraints:
  timeout_seconds: 300
  max_turns: 20

# 低成本前置门禁：属性结果文件没产出就没必要再跑校验脚本。
expect:
  files_exist:
    - attrs_result.json

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: script
  # 脚本从用例工作区根目录运行，退出码 0 表示 PASS。
  # 它直连思源确认 custom-score 是字符串形态而非数字，即Agent 自己修正了类型错误。
  script_path: evals/fixtures/scripts/verify_attr_string.py
  timeout_seconds: 60
