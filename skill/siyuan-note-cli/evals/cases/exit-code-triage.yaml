# 报告中的稳定用例 ID，与文件名保持一致。
id: exit-code-triage
# 这个用例验证什么。
title: 能根据真实错误输出判断失败类型并给出处置
# 背景：Skill 用一整张表把退出码 2/3/4/5 映射到「补参数 / 查地址 / 读 msg / 查 token」四种完全不同的处置。
# 这类知识最容易在阅读时被略过，考察 Agent 是否真的内化了映射关系，而不是笼统地说「出错了」。
description: |
  提供三段真实的思源报错输出，要求 Agent 判断每段的失败类别并给出对应处置动作。
  这是一道纯诊断题：判据是「分类是否正确 + 处置是否对得上该分类」，而不是是否复述了报错文本。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    我用思源的命令行工具时遇到了下面三段报错，分别是什么原因、应该怎么处理？
    请对每一段都给出：失败类别 + 具体处置动作。

    第一段：
    {
      "error": true,
      "command": "attr set",
      "endpoint": "/api/attr/setBlockAttrs",
      "exitCode": 4,
      "message": "/api/attr/setBlockAttrs：服务端返回 code=-1，msg=Field [attrs] has an invalid type: entry [custom-num]: json: cannot unmarshal number into Go value of type string",
      "httpStatus": 200,
      "code": -1,
      "msg": "Field [attrs] has an invalid type: entry [custom-num]: json: cannot unmarshal number into Go value of type string"
    }

    第二段：
    {
      "error": true,
      "command": "doc create",
      "endpoint": "/api/filetree/createDocWithMd",
      "exitCode": 3,
      "message": "/api/filetree/createDocWithMd：请求失败，ECONNREFUSED 127.0.0.1:6806"
    }

    第三段：
    {
      "error": true,
      "command": "sql query",
      "endpoint": "/api/sql/querySQL",
      "exitCode": 2,
      "message": "缺少必填参数：--stmt",
      "httpStatus": 0,
      "code": 0
    }

    另外顺便说一下，exitCode 5 一般是什么情况，该怎么排查？

# 覆盖默认约束。
constraints:
  timeout_seconds: 240
  max_turns: 12

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: rule_based
  # 关键判据是三段报错的分类关键词与处置动作都出现，而不是复述报错原文。
  success:
    - output_contains:
        all:
          - "字符串"
          - "token"
    - output_matches:
        any:
          - "exitCode|退出码|退出代码"
          - "(?i)exit code"
    - output_contains:
        any:
          - "ECONNREFUSED"
          - "连不上"
          - "网络"
          - "地址"
          - "服务未启动"
          - "服务没启动"
  failure:
    - output_contains:
        any:
          - "五段都没问题"
          - "没有问题"
